name: Lazy ASR startup safety

on:
  pull_request:
    paths:
      - "omnivoice/lazy_asr.py"
      - "omnivoice/cli/studio_server.py"
      - "omnivoice/cli/project_studio_voice_doctor.py"
      - "omnivoice/cli/demo_robust.py"
      - "tests/test_lazy_asr.py"
      - ".github/workflows/lazy-asr-tests.yml"
  push:
    branches:
      - "master"
    paths:
      - "omnivoice/lazy_asr.py"
      - "omnivoice/cli/studio_server.py"
      - "omnivoice/cli/project_studio_voice_doctor.py"
      - "omnivoice/cli/demo_robust.py"
      - "tests/test_lazy_asr.py"
      - ".github/workflows/lazy-asr-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile lazy ASR and launch paths
        run: |
          python -m py_compile \
            omnivoice/lazy_asr.py \
            omnivoice/cli/studio_server.py \
            omnivoice/cli/project_studio_voice_doctor.py \
            omnivoice/cli/demo_robust.py

      - name: Run lazy ASR and integration regression
        run: |
          pytest -q \
            tests/test_lazy_asr.py \
            tests/test_studio_server.py \
            tests/test_robust_longform.py \
            tests/test_voice_doctor_ui.py \
            tests/test_voice_stability.py \
            tests/test_demo_robust.py
