name: Apply language selector update

on:
  push:
    branches:
      - feat/language-selector
    paths:
      - .github/workflows/language-selector-migration.yml

permissions:
  contents: write

jobs:
  patch-language-selectors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/language-selector
          fetch-depth: 0

      - name: Patch language selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          demo = Path("omnivoice/cli/demo.py")
          text = demo.read_text(encoding="utf-8")
          old = '_ALL_LANGUAGES = ["Auto"] + sorted(lang_display_name(n) for n in LANG_NAMES)'
          new = '''_ALL_LANGUAGES = ["English", "Auto"] + sorted(
              lang_display_name(name) for name in LANG_NAMES if name != "english"
          )'''
          if old not in text:
              raise SystemExit("demo.py language list anchor not found")
          text = text.replace(old, new, 1)
          old_default = 'def _lang_dropdown(label="Language (optional) / 语种 (可选)", value="Auto"):'
          new_default = 'def _lang_dropdown(label="Language (optional) / 语种 (可选)", value="English"):'
          if old_default not in text:
              raise SystemExit("demo.py language dropdown anchor not found")
          text = text.replace(old_default, new_default, 1)
          demo.write_text(text, encoding="utf-8")

          studio = Path("omnivoice/cli/project_studio.py")
          text = studio.read_text(encoding="utf-8")
          old_import = 'from omnivoice.utils.common import get_best_device\nfrom omnivoice.voice_library import VoiceLibrary'
          new_import = 'from omnivoice.utils.common import get_best_device\nfrom omnivoice.utils.lang_map import LANG_NAMES, lang_display_name\nfrom omnivoice.voice_library import VoiceLibrary'
          if old_import not in text:
              raise SystemExit("project_studio.py import anchor not found")
          text = text.replace(old_import, new_import, 1)

          old_settings = '_STUDIO_SETTINGS = "studio.json"\n'
          new_settings = '''_STUDIO_SETTINGS = "studio.json"

_LANGUAGE_CHOICES = ["English"] + sorted(
    lang_display_name(name) for name in LANG_NAMES if name != "english"
)
'''
          if old_settings not in text:
              raise SystemExit("project_studio.py settings anchor not found")
          text = text.replace(old_settings, new_settings, 1)

          old_voice = '                voice_language_new = gr.Textbox(label="Language", value="en")'
          new_voice = '''                voice_language_new = gr.Dropdown(
                    label="Language",
                    choices=_LANGUAGE_CHOICES,
                    value="English",
                    allow_custom_value=False,
                    interactive=True,
                    info="English is prioritized; choose the reference language.",
                )'''
          if old_voice not in text:
              raise SystemExit("project_studio.py voice language anchor not found")
          text = text.replace(old_voice, new_voice, 1)

          old_generation = '                language = gr.Textbox(label="Language", value="en")'
          new_generation = '''                language = gr.Dropdown(
                    label="Language",
                    choices=_LANGUAGE_CHOICES,
                    value="English",
                    allow_custom_value=False,
                    interactive=True,
                    info="English is first; choose another supported language when needed.",
                )'''
          if old_generation not in text:
              raise SystemExit("project_studio.py generation language anchor not found")
          text = text.replace(old_generation, new_generation, 1)
          studio.write_text(text, encoding="utf-8")
          PY

      - name: Validate Python syntax
        run: python -m py_compile omnivoice/cli/demo.py omnivoice/cli/project_studio.py

      - name: Commit update and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/language-selector-migration.yml
          git add omnivoice/cli/demo.py omnivoice/cli/project_studio.py
          git commit -m "feat: add language selectors with English first"
          git push origin HEAD:feat/language-selector
